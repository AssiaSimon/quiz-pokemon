            </tr>
            <tr>
                <td><div class="container-fluid td_details">Point</div></td>
                    <td><input type="text" id="pkPoint"></td>
                </tr>
                <tr>
                    <td><div class="container-fluid td_details">Bonne réponse</div></td>
                    <td><input type="text" id="pkReponse"></td>
                    <!-- <input type="text">  -> champ monoligne
                    - n’affiche qu’une seule ligne de texte,
                    - ignore les retours à la ligne (\n),
                    - masque visuellement ce qui dépasse de la largeur visible
                    -->
                </tr>
        </table>
